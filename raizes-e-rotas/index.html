<style>
:root{
  --texto:#333333;
  --suave:#5c5c5c;
  --verde:#72A580;
  --verde-esc:#3F7352;
  --verde-cl:#EDF4EF;
  --coral:#E97B3A;
  --coral-cl:#FDF1E8;
  --linha:#D9E3DC;
  --input:#7F9486;
  --azul:#4A5A6A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--texto);background:#fff;line-height:1.65;font-size:16px}
.wrap{max-width:780px;margin:0 auto;padding:24px 20px 56px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--suave);font-weight:400}

/* cabeçalho */
.brand{display:flex;align-items:center;gap:12px;color:var(--verde-esc);font-weight:500;font-size:1rem}
.logo{display:block;width:50px;height:auto;flex:none}
h1{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(1.55rem,4.2vw,2.15rem);line-height:1.2;margin:.5rem 0 .3rem}
.sub{color:var(--suave);margin:0 0 1.4rem}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(1.4rem,3.4vw,1.75rem);line-height:1.25;margin:1.6rem 0 .8rem;outline:none}
h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:1.2rem;line-height:1.3;margin:1.8rem 0 .5rem}
p{margin:.6rem 0}

/* progresso */
.progress{margin:0 0 1.2rem}
.pbar{height:4px;background:var(--linha);border-radius:4px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--verde-esc)}
@media (prefers-reduced-motion:no-preference){.pbar span{transition:width .3s ease}}
.pdots{list-style:none;padding:0;margin:.9rem 0 .4rem;display:flex;gap:8px;flex-wrap:wrap}
.pdots button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--verde-esc);background:#fff;color:var(--verde-esc);font:500 .85rem 'Poppins',sans-serif;cursor:pointer}
.pdots button.done{background:var(--verde-cl)}
.pdots button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#2b2b2b;font-weight:600}
.pcur{margin:0;font-size:.9rem;color:var(--suave)}

/* blocos de apoio */
.aim,.reflect,.care,.recap{padding:14px 18px;border-radius:0 8px 8px 0;margin:1rem 0}
.aim{border-left:4px solid var(--verde);background:var(--verde-cl)}
.reflect{border-left:4px solid var(--coral);background:var(--coral-cl)}
.care{border-left:4px solid var(--azul);background:#F1F4F7;font-size:.92rem}
.recap{border-left:4px solid var(--verde-esc);background:var(--verde-cl)}
.aim p,.reflect p,.care p,.recap p{margin:.3rem 0}
.aim ul{margin:.4rem 0 0;padding-left:1.2rem}
.concept{border-left:2px solid var(--linha);padding-left:14px;color:var(--suave);font-size:.95rem;margin:1rem 0}

/* campos */
.field{margin:1.3rem 0;border:0;padding:0;min-width:0}
.field>label,.field>legend{display:block;font-weight:500;margin-bottom:.4rem;padding:0}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;color:var(--texto);background:#fff;border:1.5px solid var(--input);border-radius:8px;padding:10px 12px}
textarea{min-height:100px;resize:vertical}
select{appearance:auto}
:focus-visible{outline:3px solid var(--verde-esc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--verde-esc);background:#fff;color:var(--verde-esc);border-radius:999px;padding:6px 14px;font:500 .9rem 'Poppins',sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--verde-esc);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* botões */
.btn{font:500 1rem 'Poppins',sans-serif;border-radius:999px;border:1.5px solid var(--verde-esc);padding:11px 26px;cursor:pointer;background:var(--verde-esc);color:#fff;text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{background:#345f44;border-color:#345f44}
.btn.sec{background:#fff;color:var(--verde-esc)}
.btn.sec:hover{background:var(--verde-cl)}
.btn.cta{background:var(--coral);border-color:var(--coral);color:#2b2b2b;font-weight:600}
.btn.cta:hover{background:#dc6d2c;border-color:#dc6d2c}
.btn.sm{padding:6px 16px;font-size:.88rem}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:2.2rem;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:1.2rem 0}

/* critérios e cenários */
.crow{display:grid;grid-template-columns:1fr 220px auto;gap:12px 20px;align-items:end;padding:14px 0;border-top:1px solid var(--linha)}
.crow label{display:block;font-size:.85rem;color:var(--suave);margin-bottom:2px}
.add-row{display:flex;gap:10px;margin-top:1rem}
.add-row input{flex:1}
.srow2{display:flex;align-items:center;gap:10px;margin:.6rem 0}
.srow2 input{flex:1}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;flex:none;vertical-align:middle}
.crit{border:0;border-top:1px solid var(--linha);padding:16px 0 8px;margin:0;min-width:0}
.crit legend{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:1.1rem;padding:0;margin-bottom:.4rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 28px}
.slider label{display:flex;align-items:center;font-size:.9rem;font-weight:500}
.srow{display:flex;align-items:center;gap:12px}
.srow input[type=range]{flex:1;accent-color:var(--verde-esc);min-width:0}
.srow output{min-width:2.2ch;text-align:right;font-weight:600}
.slider.untouched input[type=range]{opacity:.5}
.slider.untouched output{color:var(--suave);font-weight:400}
.hint{font-size:.8rem;color:var(--suave);margin:0 0 .2rem}
.prow{margin:.7rem 0 1rem}
.prow>label{font-weight:500;font-size:.95rem;display:block}

/* leitura */
.brow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 120px;gap:8px 16px;align-items:center;margin:.7rem 0}
.bname{font-weight:500;display:flex;align-items:center}
.btrack{height:16px;background:#EEF1EF;border-radius:8px;overflow:hidden}
.bfill{height:100%;border-radius:8px}
.bval{font-weight:600;line-height:1.2}
.bval small{display:block;font-weight:400;color:var(--suave);font-size:.75rem}
.radar{max-width:540px;margin:1rem auto 0}
.radar>svg{width:100%;height:auto;display:block;overflow:visible}
.legend svg{width:34px;height:10px;flex:none}
.radar text{font:12.5px 'Poppins',sans-serif;fill:#333}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;margin:.4rem 0 0;font-size:.85rem;list-style:none;padding:0}
.legend li{display:flex;align-items:center;gap:8px}
.obs{padding-left:1.2rem}
.obs li{margin:.5rem 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha)}
th{font-weight:600}

.foot{margin-top:2.6rem;padding-top:1rem;border-top:1px solid var(--linha);font-size:.82rem;color:var(--suave)}
.foot a{color:var(--verde-esc)}
#print-area{display:none}

@media (max-width:640px){
  .radar text{font-size:15px}
  .crow{grid-template-columns:1fr}
  .brow{grid-template-columns:1fr}
  .bval small{display:inline;margin-left:8px}
  .navrow .btn{flex:1;text-align:center}
}
@media print{
  .app,#status{display:none!important}
  #print-area{display:block;font-family:'Poppins',sans-serif;color:#000;padding:0}
  #print-area h1{font-size:20pt}
  #print-area h2{font-size:14pt;margin-top:16pt}
  #print-area li{margin:3pt 0}
}
</style>
</head>

  ['opp','Oportunidade','Existe algo concreto (trabalho, documentação, rede) que torna este cenário viável?','0 = nada concreto, 10 = tudo concreto'],
  ['move','O que me move','Neste cenário, eu me movo por fuga ou por aproximação?','0 = fugir de um desconforto, 10 = ir em direção a algo que importa']
];

var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return n.toFixed(1).replace('.',',');}

function fresh(){
  return {
    step:0,
    vida:{cinco:'',pessoas:'',valores:[],inegociaveis:['','','']},
    scenarios:[{id:'s1',name:'Ficar onde estou'},{id:'s2',name:'Ir para outro país'},{id:'s3',name:'Voltar para o Brasil'}],
    criteria:['Pertencimento','Trabalho e carreira','Finanças','Vínculos e família','Bem-estar psicológico'].map(function(n,i){return {id:'c'+(i+1),name:n,weight:3};}),
    nextC:6,
    scores:{},
    nego:{},
    ready:{},
    plan:{experimento:'',passo1:'',passo2:'',passo3:'',pessoas:'',revisao:'',indicadores:'',cuidado:'',amigo:''}
  };
}
var state=fresh();
try{var raw=localStorage.getItem(KEY);if(raw){state=Object.assign(fresh(),JSON.parse(raw));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

function setPath(path,val){
  var k=path.split('.'),o=state;
  for(var i=0;i<k.length-1;i++){
    if(o[k[i]]==null||typeof o[k[i]]!=='object')o[k[i]]={};
    o=o[k[i]];
  }
  o[k[k.length-1]]=val;
}
function sc(cid,sid){return state.scores[cid]?state.scores[cid][sid]:undefined;}
function rd(sid,k){var v=state.ready[sid]?state.ready[sid][k]:undefined;return typeof v==='number'?v:null;}
function ng(sid,i){return state.nego[sid]?state.nego[sid][i]:'';}
function sname(s,i){return (s.name||'').trim()||('Cenário '+(i+1));}
function say(msg){document.getElementById('status').textContent=msg;}

/* ---------- componentes ---------- */
function sliderScenario(path,val,s,si,id){
  var t=typeof val==='number';
  return '<div class="slider'+(t?'':' untouched')+'"><label for="'+id+'"><span class="swatch" style="background:'+COL[si]+'"></span><span data-sname="'+s.id+'">'+esc(sname(s,si))+'</span></label>'+
    '<div class="srow"><input id="'+id+'" type="range" min="0" max="10" step="1" value="'+(t?val:5)+'" data-path="'+path+'" data-kind="num"><output>'+(t?val:'?')+'</output></div></div>';
}
function sliderReady(path,val,id,label,hint){
  var t=typeof val==='number';
  return '<div class="prow slider'+(t?'':' untouched')+'"><label for="'+id+'"><span>'+esc(label)+'</span></label><p class="hint">'+esc(hint)+'</p>'+
    '<div class="srow"><input id="'+id+'" type="range" min="0" max="10" step="1" value="'+(t?val:5)+'" data-path="'+path+'" data-kind="num"><output>'+(t?val:'?')+'</output></div></div>';
}

function nav(){
  var prev=state.step>0?'<button type="button" class="btn sec" data-action="prev">Voltar</button>':'<span></span>';
  var next='';
  if(state.step===0)next='<button type="button" class="btn" data-action="next">Começar</button>';
  else if(state.step<STEPS.length-1)next='<button type="button" class="btn" data-action="next">Continuar</button>';
  return '<div class="navrow">'+prev+next+'</div>';
}
function footer(){
  return '<div class="foot"><p>Ferramenta educativa. Ela organiza o seu pensamento, mas não decide por você e não substitui acompanhamento psicológico. Suas respostas ficam salvas apenas neste navegador.</p>'+
    '<p>Conteúdo: <a href="https://psicoterapiaeafins.com.br" target="_blank" rel="noopener">Psicoterapia e Afins</a>.</p></div>';
}

/* ---------- etapas ---------- */
function stepInicio(){
  return '<h2 tabindex="-1" id="step-h">Do projeto de vida ao plano migratório</h2>'+
  '<p>Decidir mudar de país de novo costuma travar porque o plano vem antes do projeto: para onde, quando, como. Esta atividade inverte a ordem. Primeiro você descreve a vida que quer construir, depois compara cenários com critérios seus e, por fim, desenha um passo pequeno e reversível.</p>'+
  '<div class="aim"><p><strong>Ao final, você terá:</strong></p><ul>'+
    '<li>uma descrição do seu projeto de vida e dos seus inegociáveis;</li>'+
    '<li>critérios próprios para comparar ficar, ir e voltar;</li>'+
    '<li>uma leitura visual das diferenças entre os cenários e das lacunas de informação;</li>'+
    '<li>um plano de 30 dias com um experimento reversível e uma data de revisão.</li></ul></div>'+
  '<p>Leva de 15 a 25 minutos, e você pode parar e voltar quando quiser. Suas respostas ficam apenas neste navegador, e nada é enviado para servidor.</p>'+
  '<div class="care"><p>Se o dilema estiver afetando seu sono, seu humor ou sua rotina, considere conversar com um(a) psicólogo(a). Esta ferramenta ajuda a pensar, mas não substitui esse cuidado.</p></div>';
}

function stepProjeto(){
  var v=state.vida;
  var chips=VALORES.map(function(x){
    var on=v.valores.indexOf(x)>-1;
    return '<button type="button" class="chip" aria-pressed="'+on+'" data-action="valor" data-v="'+x+'" data-fk="valor-'+x+'">'+x+'</button>';
  }).join('');
  var neg=[0,1,2].map(function(i){
    return '<div style="margin:.5rem 0"><label class="sr" for="ng-'+i+'">Inegociável '+(i+1)+'</label><input id="ng-'+i+'" type="text" data-path="vida.inegociaveis.'+i+'" value="'+esc(v.inegociaveis[i]||'')+'" placeholder="Inegociável '+(i+1)+(i===0?' (por exemplo: estar perto de quem eu amo)':'')+'"></div>';
  }).join('');
  return '<h2 tabindex="-1" id="step-h">Projeto de vida</h2>'+
  '<div class="aim"><p><strong>Objetivo desta etapa:</strong> descrever a vida que você quer construir, antes de pensar em país.</p></div>'+
  '<div class="field"><label for="v-cinco">Como quero que seja meu dia a dia daqui a cinco anos?</label><textarea id="v-cinco" data-path="vida.cinco" placeholder="Descreva uma terça-feira comum: onde acordo, com quem falo, o que faço ao longo do dia.">'+esc(v.cinco)+'</textarea></div>'+
  '<div class="field"><label for="v-pessoas">Que pessoas e que tipo de trabalho fazem parte desse quadro?</label><textarea id="v-pessoas" data-path="vida.pessoas">'+esc(v.pessoas)+'</textarea></div>'+
  '<fieldset class="field"><legend>Que valores quero ver refletidos nas minhas escolhas? <span class="muted">Escolha até 3.</span></legend><div class="chips">'+chips+'</div></fieldset>'+
  '<fieldset class="field"><legend>Quais são os meus inegociáveis? <span class="muted">Aquilo sem o qual a vida deixa de fazer sentido. Prefira poucos e honestos.</span></legend>'+neg+'</fieldset>'+
  '<div class="reflect"><p><strong>Pausa para refletir</strong></p><p>Releia o que escreveu. Isso descreve o que você quer construir ou o que você quer evitar? As duas coisas são legítimas, mas levam a planos diferentes.</p></div>';
}

function stepCriterios(){
  var have=state.criteria.map(function(c){return c.name.trim().toLowerCase();});
  var full=state.criteria.length>=MAXC;
  var rows=state.criteria.map(function(c,i){
    return '<div class="crow"><div><label for="cn-'+c.id+'">Critério '+(i+1)+'</label><input id="cn-'+c.id+'" type="text" data-path="criteria.'+i+'.name" value="'+esc(c.name)+'"></div>'+
      '<div class="slider"><label for="cw-'+c.id+'">Importância</label><div class="srow"><input id="cw-'+c.id+'" type="range" min="1" max="5" step="1" value="'+c.weight+'" data-path="criteria.'+i+'.weight" data-kind="num"><output>'+c.weight+'</output></div></div>'+
      '<button type="button" class="btn sec sm" data-action="rm-c" data-i="'+i+'" data-fk="rmc-'+c.id+'" aria-label="Remover critério '+esc(c.name)+'">Remover</button></div>';
  }).join('');
  var sug=SUGG.filter(function(x){return have.indexOf(x.toLowerCase())<0;}).map(function(x){
    return '<button type="button" class="chip" data-action="add-s" data-name="'+esc(x)+'" data-fk="sug-'+esc(x)+'"'+(full?' disabled':'')+'>+ '+esc(x)+'</button>';
  }).join('');
  return '<h2 tabindex="-1" id="step-h">Critérios</h2>'+
  '<div class="aim"><p><strong>Objetivo desta etapa:</strong> transformar o projeto em 5 a 8 critérios que você usará para comparar os cenários, dando a cada um o peso que ele tem para você.</p></div>'+
  '<p class="concept">Três necessidades psicológicas ajudam a escolher bons critérios, segundo a Teoria da Autodeterminação: <strong>autonomia</strong> (sentir que a vida é escolha sua), <strong>competência</strong> (usar suas habilidades e evoluir) e <strong>pertencimento</strong> (estar com pessoas com quem você pode ser inteiro(a)).</p>'+
  '<p>Você tem <strong>'+state.criteria.length+' de '+MAXC+'</strong> critérios. Renomeie, ajuste a importância ou remova o que não fizer sentido.</p>'+
  rows+
  (state.criteria.length<5?'<p class="hint">Com menos de 5 critérios, a comparação fica pobre. Adicione mais alguns.</p>':'')+
  '<h3>Sugestões</h3><div class="chips">'+(sug||'<span class="muted">Você já usou todas as sugestões.</span>')+'</div>'+
  '<div class="add-row"><label class="sr" for="novo-c">Novo critério</label><input id="novo-c" type="text" placeholder="Escreva um critério seu"'+(full?' disabled':'')+'><button type="button" class="btn sec" data-action="add-c"'+(full?' disabled':'')+'>Adicionar critério</button></div>';
}

function stepCenarios(){
  var opts=[['','Ainda não sei'],['sim','Sim'],['parte','Em parte'],['nao','Não']];
  var names=state.scenarios.map(function(s,i){
    return '<div class="srow2"><span class="swatch" style="background:'+COL[i]+'"></span><label class="sr" for="sn-'+s.id+'">Nome do cenário '+(i+1)+'</label><input id="sn-'+s.id+'" type="text" data-path="scenarios.'+i+'.name" value="'+esc(s.name)+'">'+
      (state.scenarios.length>2?'<button type="button" class="btn sec sm" data-action="rm-s" data-i="'+i+'" data-fk="rms-'+s.id+'" aria-label="Remover cenário '+esc(sname(s,i))+'">Remover</button>':'')+'</div>';
  }).join('');
  var crit=state.criteria.map(function(c,ci){
    return '<fieldset class="crit"><legend>'+esc(c.name||('Critério '+(ci+1)))+' <span class="muted" style="font-family:Poppins,sans-serif;font-size:.8rem;font-weight:400">importância '+c.weight+' de 5</span></legend><div class="sgrid">'+
      state.scenarios.map(function(s,si){return sliderScenario('scores.'+c.id+'.'+s.id,sc(c.id,s.id),s,si,'in-'+c.id+'-'+s.id);}).join('')+'</div></fieldset>';
  }).join('');
  var ins=state.vida.inegociaveis.map(function(t,i){return {t:(t||'').trim(),i:i};}).filter(function(x){return x.t;});
  var negHtml=ins.length?
    '<h3>Seus inegociáveis em cada cenário</h3><p>Cada cenário preserva o que você considera inegociável? "Ainda não sei" é uma resposta válida e vira informação na leitura.</p>'+
    ins.map(function(x){
      return '<fieldset class="crit"><legend>'+esc(x.t)+'</legend><div class="sgrid">'+state.scenarios.map(function(s,si){
        var cur=ng(s.id,x.i)||'';
        return '<div><label for="ng-'+s.id+'-'+x.i+'" style="display:flex;align-items:center;font-size:.9rem;font-weight:500;margin-bottom:4px"><span class="swatch" style="background:'+COL[si]+'"></span><span data-sname="'+s.id+'">'+esc(sname(s,si))+'</span></label>'+
          '<select id="ng-'+s.id+'-'+x.i+'" data-path="nego.'+s.id+'.'+x.i+'" data-kind="str">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(cur===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>';
      }).join('')+'</div></fieldset>';
    }).join(''):
    '<p class="muted">Você não preencheu inegociáveis na etapa Projeto de vida. Se quiser incluí-los na comparação, volte lá e adicione.</p>';
  return '<h2 tabindex="-1" id="step-h">Cenários</h2>'+
  '<div class="aim"><p><strong>Objetivo desta etapa:</strong> comparar os cenários pelos seus critérios, e não pela intuição do dia.</p></div>'+
  '<h3>Quais cenários você quer comparar?</h3>'+names+
  (state.scenarios.length<3?'<button type="button" class="btn sec sm" data-action="add-s2">Adicionar cenário</button>':'')+
  '<h3>Notas por critério</h3>'+
  '<p>Dê uma nota de 0 a 10 a cada cenário em cada critério (0 = não atende, 10 = atende muito bem). <strong>Deixe sem mexer o que você ainda não sabe avaliar</strong>: barras claras com "?" contam como falta de informação, e isso também é uma descoberta.</p>'+
  crit+negHtml+
  '<div class="reflect"><p><strong>Pausa para refletir</strong></p><p>Nos pontos que ficaram com "?", o que você precisaria descobrir para avaliar? Guarde essa lista: ela costuma ser o seu primeiro experimento.</p></div>';
}

function stepProntidao(){
  var blocks=state.scenarios.map(function(s,si){
    return '<fieldset class="crit"><legend><span class="swatch" style="background:'+COL[si]+'"></span><span data-sname="'+s.id+'">'+esc(sname(s,si))+'</span></legend>'+
      READY.map(function(r){return sliderReady('ready.'+s.id+'.'+r[0],rd(s.id,r[0]),'rd-'+s.id+'-'+r[0],r[1]+': '+r[2],r[3]);}).join('')+'</fieldset>';
  }).join('');
  return '<h2 tabindex="-1" id="step-h">Prontidão</h2>'+

  '<p>Assim como antes, deixe sem mexer o que você não souber responder.</p>'+blocks;

function results(){
  return state.scenarios.map(function(s,i){
    var num=0,den=0,n=0;
    state.criteria.forEach(function(c){var v=sc(c.id,s.id);if(typeof v==='number'){num+=v*c.weight;den+=c.weight;n++;}});
    return {s:s,i:i,name:sname(s,i),avg:den?num/den:null,n:n,total:state.criteria.length};
  });
}

function wrapLabel(t,max){
  var words=String(t).split(/\s+/),lines=[],cur='';
  words.forEach(function(w){
    if(cur&&(cur+' '+w).length>max){lines.push(cur);cur=w;}
    else cur=cur?cur+' '+w:w;
  });
  if(cur)lines.push(cur);
  return lines.length?lines:[''];
}
function radar(){
  var cr=state.criteria,n=cr.length;
  if(n<3)return '';
  var cx=230,cy=185,R=100,LH=14,out='';
  function pt(k,r){var a=-Math.PI/2+2*Math.PI*k/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  [2,4,6,8,10].forEach(function(l){
    var p=cr.map(function(_,k){return pt(k,R*l/10).map(function(x){return x.toFixed(1);}).join(',');}).join(' ');
    out+='<polygon points="'+p+'" fill="none" stroke="#D9E3DC" stroke-width="1"/>';
  });
  cr.forEach(function(c,k){
    var e=pt(k,R),l=pt(k,R+14),a=-Math.PI/2+2*Math.PI*k/n,co=Math.cos(a),si=Math.sin(a);
    out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="#D9E3DC"/>';
    var lines=wrapLabel(c.name||('Critério '+(k+1)),13);
    var y0;
    if(si<-0.3)y0=l[1]-(lines.length-1)*LH-3;
    else if(si>0.3)y0=l[1]+11;
    else y0=l[1]+4-(lines.length-1)*LH/2;
    var anchor=co>0.3?'start':(co<-0.3?'end':'middle');
    out+='<text text-anchor="'+anchor+'"><title>'+esc(c.name)+'</title>'+lines.map(function(t,i){
      return '<tspan x="'+l[0].toFixed(1)+'" y="'+(y0+i*LH).toFixed(1)+'">'+esc(t)+'</tspan>';
    }).join('')+'</text>';
  });
  state.scenarios.forEach(function(s,si){
    var pts=cr.map(function(c,k){var v=sc(c.id,s.id);return pt(k,R*(typeof v==='number'?v:0)/10);});
    var p=pts.map(function(x){return x[0].toFixed(1)+','+x[1].toFixed(1);}).join(' ');
    out+='<polygon points="'+p+'" fill="'+COL[si]+'" fill-opacity="0.10" stroke="'+COL[si]+'" stroke-width="2.4"'+(DASH[si]?' stroke-dasharray="'+DASH[si]+'"':'')+' stroke-linejoin="round"/>';
    pts.forEach(function(x){out+='<circle cx="'+x[0].toFixed(1)+'" cy="'+x[1].toFixed(1)+'" r="3" fill="'+COL[si]+'"/>';});
  });
  var leg=state.scenarios.map(function(s,si){
    return '<li><svg width="34" height="10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="'+COL[si]+'" stroke-width="2.6"'+(DASH[si]?' stroke-dasharray="'+DASH[si]+'"':'')+'/></svg>'+esc(sname(s,si))+'</li>';
  }).join('');
  return '<div class="radar"><svg viewBox="0 0 460 370" role="img" aria-label="Gráfico radar comparando os cenários em cada critério, de 0 a 10">'+out+'</svg><ul class="legend">'+leg+'</ul><p class="hint" style="text-align:center">Pontos no centro indicam critérios ainda sem nota.</p></div>';
}

function observations(){
  var out=[],res=results(),scored=res.filter(function(r){return r.avg!=null;});
  if(!scored.length){
    out.push('Você ainda não deu notas aos critérios. Volte à etapa Cenários para começar a comparação.');
  }else{
    var so=scored.slice().sort(function(a,b){return b.avg-a.avg;});
    if(so.length>=2){
      var d=so[0].avg-so[1].avg;
      if(d<0.8)out.push('A diferença entre <strong>'+esc(so[0].name)+'</strong> e <strong>'+esc(so[1].name)+'</strong> é pequena ('+fmt(d)+' ponto). Empates costumam indicar falta de informação: veja abaixo onde os cenários mais se diferenciam e onde ainda há critérios sem nota.');
      else out.push('Pela sua ponderação de hoje, <strong>'+esc(so[0].name)+'</strong> tem a maior pontuação, com '+fmt(d)+' ponto de vantagem. Isso descreve o que você pesou agora e muda se as notas mudarem.');
    }else{
      out.push('Só um cenário tem notas até agora. Avalie ao menos dois para que a comparação faça sentido.');
    }
    res.forEach(function(r){
      if(r.n>0&&r.n<r.total)out.push('Em <strong>'+esc(r.name)+'</strong>, '+(r.total-r.n)+' de '+r.total+' critérios ficaram sem nota. Descobrir isso pode ser um bom primeiro experimento.');
    });
  }
  state.scenarios.forEach(function(s,si){
    var unknown=0;
    state.vida.inegociaveis.forEach(function(t,i){
      t=(t||'').trim();if(!t)return;
      var v=ng(s.id,i);
      if(v==='nao')out.push('<strong>'+esc(sname(s,si))+'</strong> não preserva um dos seus inegociáveis: “'+esc(t)+'”. Isso merece atenção especial, porque inegociáveis não entram numa média.');
      else if(!v)unknown++;
    });
    if(unknown>0)out.push('Ainda não está claro se <strong>'+esc(sname(s,si))+'</strong> preserva '+unknown+(unknown>1?' dos seus inegociáveis':' dos seus inegociáveis')+'. Essa pode ser a primeira pergunta a investigar.');
  });
  state.scenarios.forEach(function(s,si){
    var cap=rd(s.id,'cap'),opp=rd(s.id,'opp'),mv=rd(s.id,'move'),nm=esc(sname(s,si));
    if((cap!==null&&cap<=3)||(opp!==null&&opp<=3))out.push('Em <strong>'+nm+'</strong>, capacidade ou oportunidade estão baixas hoje. Pode ser que o dilema seja mais sobre o momento do que sobre querer (modelo COM-B).');
    if(mv!==null&&mv<=3)out.push('Em <strong>'+nm+'</strong>, o que te move parece mais fuga do que aproximação. Vale perguntar: existe outra saída para esse desconforto, dentro ou fora deste cenário?');
  });
  return out;
}

function stepLeitura(){
  var res=results();
  var bars=res.map(function(r){
    return '<div class="brow"><div class="bname"><span class="swatch" style="background:'+COL[r.i]+'"></span>'+esc(r.name)+'</div>'+
      '<div class="btrack" role="img" aria-label="'+esc(r.name)+': '+(r.avg==null?'sem nota':fmt(r.avg)+' de 10')+'"><div class="bfill" style="width:'+(r.avg==null?0:r.avg*10)+'%;background:'+COL[r.i]+'"></div></div>'+
      '<div class="bval">'+(r.avg==null?'sem nota':fmt(r.avg)+' de 10')+'<small>'+r.n+' de '+r.total+' critérios</small></div></div>';
  }).join('');
  var diffs=state.criteria.map(function(c){
    var vals=state.scenarios.map(function(s,i){return {n:sname(s,i),v:sc(c.id,s.id)};}).filter(function(x){return typeof x.v==='number';});
    if(vals.length<2)return null;
    var mx=Math.max.apply(null,vals.map(function(x){return x.v;})),mn=Math.min.apply(null,vals.map(function(x){return x.v;}));
    return {c:c,vals:vals,sp:mx-mn};
  }).filter(function(x){return x&&x.sp>0;}).sort(function(a,b){return b.sp-a.sp;}).slice(0,3);
  var diffHtml=diffs.length?'<h3>Onde os cenários mais se diferenciam</h3><ul class="obs">'+diffs.map(function(d){
    return '<li><strong>'+esc(d.c.name)+'</strong>: '+d.vals.map(function(v){return esc(v.n)+' ('+v.v+')';}).join(', ')+'</li>';
  }).join('')+'</ul><p class="hint">Esses são os critérios que mais pesam na diferença entre as opções. Vale conferir se as notas refletem fatos ou impressões.</p>':'';
  function cell(v){return v===null?'<span class="muted">sem nota</span>':String(v);}
  var table='<div class="tablewrap"><table><caption class="sr">Prontidão por cenário</caption><thead><tr><th scope="col">Cenário</th><th scope="col">Capacidade</th><th scope="col">Oportunidade</th><th scope="col">O que me move</th></tr></thead><tbody>'+
    state.scenarios.map(function(s,i){return '<tr><th scope="row">'+esc(sname(s,i))+'</th><td>'+cell(rd(s.id,'cap'))+'</td><td>'+cell(rd(s.id,'opp'))+'</td><td>'+cell(rd(s.id,'move'))+'</td></tr>';}).join('')+
    '</tbody></table></div><p class="hint">Em "O que me move", valores baixos indicam fuga e valores altos indicam aproximação.</p>';
  return '<h2 tabindex="-1" id="step-h">Leitura</h2>'+
  '<div class="aim"><p><strong>Objetivo desta etapa:</strong> ver o que o seu próprio raciocínio mostra, incluindo o que ainda falta saber.</p></div>'+
  '<p>Esta leitura é um espelho do que você pesou hoje, não um veredito. Se você mudar as notas ou a importância dos critérios, ela muda junto.</p>'+
  '<h3>Pontuação ponderada</h3>'+bars+radar()+diffHtml+
  '<h3>Prontidão</h3>'+table+
  '<h3>O que chama atenção</h3><ul class="obs">'+observations().map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul>'+
  '<div class="recap"><p><strong>Ideia central</strong></p><p>Você não precisa escolher um país hoje. Precisa saber o que cada cenário oferece para o que importa para você, e o que ainda não sabe. Quando faltam dados, o próximo passo é um experimento, não uma decisão definitiva.</p></div>';
}

    '<div style="margin:.5rem 0"><label class="sr" for="p-3">Terceiro passo</label><input id="p-3" type="text" data-path="plan.passo3" value="'+esc(p.passo3)+'" placeholder="Terceiro passo, quando o experimento terminar"></div></fieldset>'+
  tx('p-pes','Com quem vou conversar antes de decidir?','plan.pessoas',p.pessoas,'Pessoas que já passaram por isso, profissionais de imigração, família')+

  tx('p-ind','O que vou olhar nessa revisão?','plan.indicadores',p.indicadores,'Por exemplo: como estou dormindo, quanto consegui descobrir, como me senti no experimento')+

  ta('p-ami','O que eu diria a esse amigo','plan.amigo',p.amigo,'')+
  '<h3>Guardar o que você fez</h3>'+

  '<div class="care"><p>Se o dilema estiver pesando no sono, no humor ou na rotina, um acompanhamento psicológico pode ajudar a separar o que é decisão do que é sofrimento pedindo cuidado.</p><p style="margin-top:.7rem"><a class="btn cta sm" href="https://psicoterapiaeafins.com.br" target="_blank" rel="noopener">Conhecer o trabalho de Psicoterapia e Afins</a></p></div>';
}

var BODIES=[stepInicio,stepProjeto,stepCriterios,stepCenarios,stepProntidao,stepLeitura,stepPlano];

/* ---------- resumo ---------- */
function summary(){
  var v=state.vida,p=state.plan,S=[];
  function d(x){return x&&String(x).trim()?String(x).trim():'(não preenchido)';}
  var l1=['Daqui a cinco anos: '+d(v.cinco),'Pessoas e trabalho: '+d(v.pessoas),'Valores: '+(v.valores.length?v.valores.join(', '):'(não preenchido)')];
  v.inegociaveis.forEach(function(x,i){if((x||'').trim())l1.push('Inegociável '+(i+1)+': '+x.trim());});
  S.push({t:'Projeto de vida',l:l1});
  S.push({t:'Critérios',l:state.criteria.map(function(c){return c.name+' (importância '+c.weight+' de 5)';})});
  S.push({t:'Cenários',l:results().map(function(r){return r.name+': '+(r.avg==null?'sem nota':fmt(r.avg)+' de 10')+' ('+r.n+' de '+r.total+' critérios avaliados)';})});
  S.push({t:'Prontidão',l:state.scenarios.map(function(s,i){
    function q(x){return x===null?'sem nota':x;}
    return sname(s,i)+': capacidade '+q(rd(s.id,'cap'))+', oportunidade '+q(rd(s.id,'opp'))+', o que me move '+q(rd(s.id,'move'));
  })});
  S.push({t:'Plano de 30 dias',l:['Experimento reversível: '+d(p.experimento),'Primeiro passo: '+d(p.passo1),'Segundo passo: '+d(p.passo2),'Terceiro passo: '+d(p.passo3),'Vou conversar com: '+d(p.pessoas),'Data de revisão: '+(p.revisao?new Date(p.revisao+'T12:00:00').toLocaleDateString('pt-BR'):'(não preenchida)'),'Vou olhar na revisão: '+d(p.indicadores)]});
  S.push({t:'Cuidado e reflexão',l:['Como vou cuidar de mim: '+d(p.cuidado),'O que eu diria a um amigo no meu lugar: '+d(p.amigo)]});
  return S;
}
function summaryText(){
  var t='Raízes e Rotas (Psicoterapia e Afins)\n'+new Date().toLocaleDateString('pt-BR')+'\n';
  summary().forEach(function(s){t+='\n'+s.t+'\n'+s.l.map(function(x){return '- '+x;}).join('\n')+'\n';});
  return t;
}
function summaryHtml(){
  var h='<h1>Raízes e Rotas</h1><p>Do projeto de vida ao plano migratório. Psicoterapia e Afins, '+new Date().toLocaleDateString('pt-BR')+'</p>';
  summary().forEach(function(s){h+='<h2>'+esc(s.t)+'</h2><ul>'+s.l.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';});

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){return true;},function(){return fallbackCopy(t);});}
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);return ok;
}

/* ---------- render ---------- */
function post(scrollTop){
  try{parent.postMessage({raizesrotas:true,height:Math.ceil(app.getBoundingClientRect().height)+16,scrollTop:!!scrollTop},'*');}catch(e){}
}
function render(stepChanged){
  var fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  app.innerHTML=header()+BODIES[state.step]()+nav()+footer();
  if(stepChanged){
    var h=document.getElementById('step-h');if(h)h.focus({preventScroll:true});
    window.scrollTo(0,0);
  }else if(fk){
    var el=app.querySelector('[data-fk="'+fk.replace(/"/g,'\\"')+'"]');if(el)el.focus({preventScroll:true});
  }
  post(stepChanged);
}
function go(n){state.step=Math.max(0,Math.min(STEPS.length-1,n));save();render(true);}

/* ---------- eventos ---------- */
function applyInput(t){
  var val=(t.dataset.kind==='num')?Number(t.value):t.value;
  setPath(t.dataset.path,val);save();
  if(t.type==='range'){
    var w=t.closest('.slider');if(w)w.classList.remove('untouched');
    var o=t.parentNode.querySelector('output');if(o)o.textContent=t.value;
  }
  var m=/^scenarios\.(\d+)\.name$/.exec(t.dataset.path);
  if(m){
    var idx=Number(m[1]),s=state.scenarios[idx];
    var els=app.querySelectorAll('[data-sname="'+s.id+'"]');
    for(var i=0;i<els.length;i++)els[i].textContent=sname(s,idx);
  }
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.path)applyInput(t);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.tagName==='SELECT'&&t.dataset.path)applyInput(t);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='novo-c'){e.preventDefault();addCustom();}
});
function addCriterion(name){
  name=(name||'').trim();if(!name)return;
  if(state.criteria.length>=MAXC){say('Você já tem 8 critérios. Remova um para adicionar outro.');return;}
  state.criteria.push({id:'c'+(state.nextC++),name:name,weight:3});
  save();render(false);say('Critério adicionado: '+name);
}
function addCustom(){
  var i=document.getElementById('novo-c');if(!i)return;
  var v=i.value;addCriterion(v);
  var again=document.getElementById('novo-c');if(again&&!again.disabled)again.focus();
}
document.addEventListener('click',function(e){
  var t=e.target;
  if(t&&t.type==='range'&&t.dataset&&t.dataset.path){
    var w=t.closest('.slider');if(w&&w.classList.contains('untouched'))applyInput(t);
    return;
  }
  var b=t.closest?t.closest('[data-action]'):null;if(!b||b.disabled)return;
  var a=b.dataset.action;
  if(a==='go')return go(Number(b.dataset.step));
  if(a==='next')return go(state.step+1);
  if(a==='prev')return go(state.step-1);
  if(a==='valor'){
    var x=b.dataset.v,arr=state.vida.valores,k=arr.indexOf(x);
    if(k>-1)arr.splice(k,1);
    else if(arr.length<3)arr.push(x);
    else{say('Você já escolheu 3 valores. Desmarque um para trocar.');return;}
    save();return render(false);
  }
  if(a==='add-s'){return addCriterion(b.dataset.name);}
  if(a==='add-c'){return addCustom();}
  if(a==='rm-c'){
    var i=Number(b.dataset.i),c=state.criteria[i];
    state.criteria.splice(i,1);delete state.scores[c.id];save();render(false);say('Critério removido.');
    var f=app.querySelector('[data-action="add-c"]');if(f&&!f.disabled)f.focus();
    return;
  }
  if(a==='add-s2'){
    if(state.scenarios.length>=3)return;
    var id=['s1','s2','s3'].filter(function(z){return !state.scenarios.some(function(s){return s.id===z;});})[0];
    state.scenarios.push({id:id,name:''});save();render(false);
    var inp=document.getElementById('sn-'+id);if(inp)inp.focus();
    return;
  }
  if(a==='rm-s'){
    if(state.scenarios.length<=2)return;
    state.scenarios.splice(Number(b.dataset.i),1);save();render(false);say('Cenário removido.');
    return;
  }
  if(a==='copy'){
    copyText(summaryText()).then(function(ok){say(ok?'Resumo copiado.':'Não foi possível copiar. Use a opção de imprimir ou salvar em PDF.');});
    return;
  }
  if(a==='print'){
    document.getElementById('print-area').innerHTML=summaryHtml();
    window.print();
    return;
  }
  if(a==='reset'){
    if(window.confirm('Isso apaga todas as suas respostas neste navegador. Deseja recomeçar?')){
      state=fresh();save();render(true);
    }
  }
});

if(window.ResizeObserver){new ResizeObserver(function(){post(false);}).observe(app);}
render(false);
})();
</script>
</body>
</html>
